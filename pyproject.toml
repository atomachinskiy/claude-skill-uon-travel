[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts/__pycache__"]

[tool.ruff.lint]
# E — pycodestyle errors, F — pyflakes, I — isort, B — bugbear, UP — pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line too long — мы сами решаем
  "E402",  # module level import not at top — нужно для sys.path.insert
  "B008",  # function call in default arg — не критично
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
